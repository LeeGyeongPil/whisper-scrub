# Tests run offline: they replay recorded Whisper output and synthetic WAVs, no model download.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, to notice when dependencies or runtimes break us
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.6.0
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -q
      - name: Build wheel and sdist
        if: matrix.python-version == '3.12'
        run: uv build
